<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Tap Tap Love</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #32104f,
                    #7b2cbf
                );

            color: white;

            display: flex;

            justify-content: center;

            padding: 30px 15px;

        }


        .game {

            width: 100%;

            max-width: 420px;

            text-align: center;

        }


        /* =========================
           HEADER
        ========================= */

        h1 {

            margin-bottom: 5px;

        }


        .subtitle {

            opacity: 0.8;

            margin-top: 0;

        }


        /* =========================
           LOVE
        ========================= */

        .love-box {

            background:
                rgba(255, 255, 255, 0.12);

            border-radius: 20px;

            padding: 20px;

            margin: 20px 0;

        }


        .love-label {

            font-size: 14px;

            opacity: 0.8;

        }


        .love {

            font-size: 48px;

            font-weight: bold;

            margin-top: 5px;

        }


        /* =========================
           TAP AREA
        ========================= */

        .tap-area {

            position: relative;

            height: 230px;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        #tapButton {

            width: 180px;

            height: 180px;

            border: none;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ff7aaa,
                    #ff2f75
                );

            font-size: 80px;

            cursor: pointer;

            box-shadow:
                0 10px 0 #b51f5b,
                0 15px 30px
                rgba(0, 0, 0, 0.3);

            transition: 0.1s;

        }


        #tapButton:active {

            transform:
                translateY(8px)
                scale(0.95);

            box-shadow:
                0 2px 0 #b51f5b,
                0 5px 15px
                rgba(0, 0, 0, 0.3);

        }


        /* =========================
           +LOVE
        ========================= */

        .floating-love {

            position: absolute;

            font-size: 28px;

            font-weight: bold;

            pointer-events: none;

            animation:
                floatUp
                0.8s
                ease-out
                forwards;

        }


        @keyframes floatUp {

            0% {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

            100% {

                opacity: 0;

                transform:
                    translateY(-100px)
                    scale(1.4);

            }

        }


        /* =========================
           PROGRESS
        ========================= */

        .progress-box {

            margin:
                15px
                0
                25px;

        }


        .progress-text {

            font-size: 14px;

            margin-bottom: 8px;

        }


        .progress {

            height: 15px;

            background:
                rgba(255, 255, 255, 0.2);

            border-radius: 20px;

            overflow: hidden;

        }


        #progressBar {

            height: 100%;

            width: 0%;

            background: #ffcf33;

            transition:
                width
                0.2s;

        }


        /* =========================
           GIFTS
        ========================= */

        .gifts-title {

            margin-bottom: 12px;

        }


        .gifts {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

        }


        .gift {

            background:
                rgba(255, 255, 255, 0.1);

            border-radius: 15px;

            padding: 15px 5px;

            opacity: 0.35;

            filter: grayscale(1);

            transition: 0.3s;

            cursor: not-allowed;

        }


        .gift.unlocked {

            opacity: 1;

            filter: grayscale(0);

            background:
                rgba(255, 255, 255, 0.2);

            transform: scale(1.05);

            cursor: pointer;

        }


        .gift.unlocked:hover {

            transform:
                scale(1.1)
                rotate(2deg);

        }


        .gift-emoji {

            font-size: 40px;

        }


        .gift-name {

            font-size: 13px;

            margin-top: 5px;

        }


        .gift-love {

            font-size: 11px;

            opacity: 0.7;

        }


        /* =========================
           MESSAGE
        ========================= */

        #message {

            margin-top: 20px;

            min-height: 30px;

            font-weight: bold;

        }


        /* =========================
           GIFT EFFECT
        ========================= */

        .gift-effect {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background:
                rgba(30, 10, 50, 0.88);

            display: none;

            justify-content: center;

            align-items: center;

            z-index: 100;

            overflow: hidden;

        }


        .gift-effect.show {

            display: flex;

        }


        .gift-effect-content {

            position: relative;

            text-align: center;

            background: white;

            color: #32104f;

            width: 290px;

            padding: 30px;

            border-radius: 25px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.4);

            animation:
                giftPop
                0.4s
                ease;

        }


        .effect-emoji {

            font-size: 110px;

            animation:
                giftBounce
                0.8s
                infinite;

        }


        .gift-effect-content h2 {

            margin:
                10px
                0
                5px;

        }


        .gift-effect-content p {

            color: #666;

            margin-bottom: 20px;

        }


        #closeGift {

            border: none;

            background: #ff4d8d;

            color: white;

            padding:
                12px
                25px;

            border-radius: 20px;

            font-weight: bold;

            cursor: pointer;

        }


        #closeGift:hover {

            background: #e83270;

        }


        @keyframes giftPop {

            0% {

                transform:
                    scale(0.4)
                    rotate(-10deg);

                opacity: 0;

            }

            70% {

                transform:
                    scale(1.1)
                    rotate(3deg);

            }

            100% {

                transform:
                    scale(1)
                    rotate(0);

                opacity: 1;

            }

        }


        @keyframes giftBounce {

            0%,
            100% {

                transform:
                    translateY(0)
                    rotate(0);

            }

            50% {

                transform:
                    translateY(-18px)
                    rotate(5deg);

            }

        }


        /* =========================
           CONFETTI
        ========================= */

        .confetti {

            position: absolute;

            font-size: 25px;

            pointer-events: none;

            animation:
                confettiFall
                1.5s
                ease-out
                forwards;

        }


        @keyframes confettiFall {

            0% {

                opacity: 1;

                transform:
                    translateY(-100px)
                    rotate(0deg);

            }

            100% {

                opacity: 0;

                transform:
                    translateY(500px)
                    rotate(360deg);

            }

        }

    </style>

</head>


<body>


<div class="game">


    <h1>
        💗 Tap Tap Love
    </h1>


    <p class="subtitle">
        Tap terus dan buka semua gift!
    </p>


    <!-- LOVE -->

    <div class="love-box">

        <div class="love-label">
            YOUR LOVE
        </div>

        <div class="love">

            ❤️

            <span id="love">
                0
            </span>

        </div>

    </div>


    <!-- TAP BUTTON -->

    <div
        class="tap-area"
        id="tapArea"
    >

        <button id="tapButton">
            ❤️
        </button>

    </div>


    <!-- PROGRESS -->

    <div class="progress-box">

        <div
            class="progress-text"
            id="progressText"
        >
            10 Love lagi untuk gift pertama!
        </div>


        <div class="progress">

            <div
                id="progressBar"
            ></div>

        </div>

    </div>


    <!-- GIFTS -->

    <h2 class="gifts-title">
        🎁 Gift
    </h2>


    <div class="gifts">


        <div
            class="gift"
            id="gift1"
        >

            <div class="gift-emoji">
                🌹
            </div>

            <div class="gift-name">
                Rose
            </div>

            <div class="gift-love">
                10 Love
            </div>

        </div>


        <div
            class="gift"
            id="gift2"
        >

            <div class="gift-emoji">
                🌸
            </div>

            <div class="gift-name">
                Flower
            </div>

            <div class="gift-love">
                25 Love
            </div>

        </div>


        <div
            class="gift"
            id="gift3"
        >

            <div class="gift-emoji">
                💎
            </div>

            <div class="gift-name">
                Diamond
            </div>

            <div class="gift-love">
                50 Love
            </div>

        </div>


        <div
            class="gift"
            id="gift4"
        >

            <div class="gift-emoji">
                🧸
            </div>

            <div class="gift-name">
                Teddy Bear
            </div>

            <div class="gift-love">
                100 Love
            </div>

        </div>


        <div
            class="gift"
            id="gift5"
        >

            <div class="gift-emoji">
                🐳
            </div>

            <div class="gift-name">
                Whale
            </div>

            <div class="gift-love">
                250 Love
            </div>

        </div>


        <div
            class="gift"
            id="gift6"
        >

            <div class="gift-emoji">
                👑
            </div>

            <div class="gift-name">
                Crown
            </div>

            <div class="gift-love">
                500 Love
            </div>

        </div>


    </div>


    <div id="message">

        Tap ❤️ untuk mulai!

    </div>


</div>


<!-- =========================================
     GIFT POPUP
========================================= -->

<div
    id="giftEffect"
    class="gift-effect"
>


    <div class="gift-effect-content">


        <div
            id="effectEmoji"
            class="effect-emoji"
        >
            🎁
        </div>


        <h2 id="effectTitle">
            Gift Terbuka!
        </h2>


        <p id="effectText">
            Kamu mendapatkan gift!
        </p>


        <button id="closeGift">
            Tutup
        </button>


    </div>


</div>


<script>


// =========================================
// 1. VARIABLE
// =========================================


let love = 0;


// =========================================
// 2. DATA GIFTS
// =========================================


let gifts = [

    {
        id: "gift1",

        name: "Rose",

        emoji: "🌹",

        target: 10
    },


    {
        id: "gift2",

        name: "Flower",

        emoji: "🌸",

        target: 25
    },


    {
        id: "gift3",

        name: "Diamond",

        emoji: "💎",

        target: 50
    },


    {
        id: "gift4",

        name: "Teddy Bear",

        emoji: "🧸",

        target: 100
    },


    {
        id: "gift5",

        name: "Whale",

        emoji: "🐳",

        target: 250
    },


    {
        id: "gift6",

        name: "Crown",

        emoji: "👑",

        target: 500
    }

];


// =========================================
// 3. DOM
// =========================================


const loveText =
    document.getElementById("love");


const tapButton =
    document.getElementById("tapButton");


const tapArea =
    document.getElementById("tapArea");


const progressBar =
    document.getElementById("progressBar");


const progressText =
    document.getElementById("progressText");


const message =
    document.getElementById("message");


const giftEffect =
    document.getElementById("giftEffect");


const effectEmoji =
    document.getElementById("effectEmoji");


const effectTitle =
    document.getElementById("effectTitle");


const effectText =
    document.getElementById("effectText");


const closeGift =
    document.getElementById("closeGift");


// =========================================
// 4. TAP LOVE
// =========================================


function tapLove() {


    // Tambah 1 Love

    love++;


    // Update angka Love

    loveText.textContent =
        love;


    // Tampilkan +1

    showFloatingLove();


    // Cek gift

    checkGifts();


    // Update progress

    updateProgress();

}


// =========================================
// 5. +1 LOVE
// =========================================


function showFloatingLove() {


    let text =
        document.createElement("div");


    text.className =
        "floating-love";


    text.textContent =
        "+1 ❤️";


    text.style.left =
        (30 + Math.random() * 40)
        + "%";


    text.style.top =
        (30 + Math.random() * 30)
        + "%";


    tapArea.appendChild(text);


    setTimeout(function () {

        text.remove();

    }, 800);

}


// =========================================
// 6. CEK GIFT
// =========================================


function checkGifts() {


    gifts.forEach(function (gift) {


        if (love >= gift.target) {


            let element =
                document.getElementById(
                    gift.id
                );


            element.classList.add(
                "unlocked"
            );


            // Gift bisa diklik

            element.onclick =
                function () {

                    showGift(gift);

                };


        }

    });

}


// =========================================
// 7. TAMPILKAN GIFT
// =========================================


function showGift(gift) {


    // Masukkan emoji

    effectEmoji.textContent =
        gift.emoji;


    // Masukkan nama

    effectTitle.textContent =
        "🎉 " +
        gift.name +
        " Terbuka!";


    // Masukkan pesan

    effectText.textContent =
        "Kamu mendapatkan " +
        gift.name +
        "!";


    // Tampilkan popup

    giftEffect.classList.add(
        "show"
    );


    // Buat confetti

    createConfetti();

}


// =========================================
// 8. CONFETTI
// =========================================


function createConfetti() {


    let emojis = [

        "✨",
        "💗",
        "❤️",
        "⭐",
        "🎉",
        "💜"

    ];


    for (
        let i = 0;
        i < 20;
        i++
    ) {


        let confetti =
            document.createElement("div");


        confetti.className =
            "confetti";


        confetti.textContent =
            emojis[
                Math.floor(
                    Math.random()
                    * emojis.length
                )
            ];


        confetti.style.left =
            Math.random() * 100
            + "%";


        confetti.style.top =
            Math.random() * 30
            + "%";


        confetti.style.animationDelay =
            Math.random() * 0.5
            + "s";


        giftEffect.appendChild(
            confetti
        );


        setTimeout(function () {

            confetti.remove();

        }, 2000);

    }

}


// =========================================
// 9. PROGRESS
// =========================================


function updateProgress() {


    // Cari gift berikutnya

    let nextGift = null;


    for (
        let i = 0;
        i < gifts.length;
        i++
    ) {


        if (
            love <
            gifts[i].target
        ) {

            nextGift =
                gifts[i];

            break;

        }

    }


    // Semua gift terbuka

    if (nextGift === null) {


        progressBar.style.width =
            "100%";


        progressText.textContent =
            "🎉 Semua gift terbuka!";


        message.textContent =
            "👑 Kamu berhasil membuka semua gift!";


        return;

    }


    // Cari target sebelumnya

    let previousTarget = 0;


    for (
        let i = 0;
        i < gifts.length;
        i++
    ) {


        if (
            gifts[i].target <
            nextGift.target
        ) {

            previousTarget =
                gifts[i].target;

        }

    }


    // Hitung progress

    let progress =
        (
            (love - previousTarget)
            /
            (nextGift.target - previousTarget)
        )
        * 100;


    progressBar.style.width =
        progress + "%";


    // Love yang masih dibutuhkan

    let remaining =
        nextGift.target - love;


    progressText.textContent =
        remaining +
        " Love lagi untuk " +
        nextGift.emoji +
        " " +
        nextGift.name +
        "!";


    message.textContent =
        "Ayo tap lagi! ❤️";

}


// =========================================
// 10. TUTUP GIFT
// =========================================


closeGift.addEventListener(
    "click",
    function () {


        giftEffect.classList.remove(
            "show"
        );


    }
);


// =========================================
// 11. KLIK DI LUAR POPUP
// =========================================


giftEffect.addEventListener(
    "click",
    function (event) {


        if (
            event.target ===
            giftEffect
        ) {

            giftEffect.classList.remove(
                "show"
            );

        }

    }
);


// =========================================
// 12. EVENT TAP
// =========================================


tapButton.addEventListener(
    "click",
    tapLove
);


// =========================================
// 13. START
// =========================================


updateProgress();


</script>


</body>

</html>
