<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Survive! - JavaScript Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .info {
            display: flex;
            justify-content: space-between;

            width: 600px;
            margin-bottom: 10px;

            font-size: 18px;
            font-weight: bold;
        }

        canvas {
            display: block;

            background: white;
            border: 3px solid #222;

            border-radius: 10px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;

            border: none;
            border-radius: 8px;

            background: #222;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        .instruction {
            margin-top: 10px;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="game-container">

        <h1>Survive!</h1>

        <div class="info">
            <div>Score: <span id="score">0</span></div>
            <div>Lives: <span id="lives">3</span></div>
            <div>Time: <span id="time">30</span></div>
        </div>

        <canvas id="gameCanvas" width="600" height="400"></canvas>

        <button id="startButton">
            Start Game
        </button>

        <div class="instruction">
            Use ← ↑ ↓ → or W A S D to move
        </div>

    </div>


    <script>

        // ==========================================
        // 1. GET HTML ELEMENTS
        // ==========================================

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreElement = document.getElementById("score");
        const livesElement = document.getElementById("lives");
        const timeElement = document.getElementById("time");

        const startButton = document.getElementById("startButton");


        // ==========================================
        // 2. GAME STATE
        // ==========================================

        let gameState = "ready";

        let score = 0;
        let lives = 3;
        let timeLeft = 30;

        let gameTimer;


        // ==========================================
        // 3. PLAYER
        // ==========================================

        const player = {
            x: 50,
            y: 180,

            width: 30,
            height: 30,

            speed: 5
        };


        // ==========================================
        // 4. KEYBOARD INPUT
        // ==========================================

        const keys = {};

        document.addEventListener("keydown", function (event) {

            keys[event.key.toLowerCase()] = true;

        });


        document.addEventListener("keyup", function (event) {

            keys[event.key.toLowerCase()] = false;

        });


        // ==========================================
        // 5. ENEMY
        // ==========================================

        const enemies = [

            {
                x: 550,
                y: 80,

                width: 30,
                height: 30,

                speed: 3
            },

            {
                x: 450,
                y: 300,

                width: 30,
                height: 30,

                speed: 4
            },

            {
                x: 300,
                y: 50,

                width: 30,
                height: 30,

                speed: 2
            }

        ];


        // ==========================================
        // 6. COIN
        // ==========================================

        const coin = {

            x: 300,
            y: 200,

            width: 20,
            height: 20

        };


        // ==========================================
        // 7. DRAW PLAYER
        // ==========================================

        function drawPlayer() {

            ctx.fillStyle = "blue";

            ctx.fillRect(
                player.x,
                player.y,
                player.width,
                player.height
            );

        }


        // ==========================================
        // 8. DRAW ENEMIES
        // ==========================================

        function drawEnemies() {

            ctx.fillStyle = "red";

            enemies.forEach(function (enemy) {

                ctx.fillRect(
                    enemy.x,
                    enemy.y,
                    enemy.width,
                    enemy.height
                );

            });

        }


        // ==========================================
        // 9. DRAW COIN
        // ==========================================

        function drawCoin() {

            ctx.fillStyle = "gold";

            ctx.beginPath();

            ctx.arc(
                coin.x + coin.width / 2,
                coin.y + coin.height / 2,
                coin.width / 2,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }


        // ==========================================
        // 10. DRAW GAME
        // ==========================================

        function draw() {

            // Clear canvas

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            // Draw objects

            drawPlayer();

            drawEnemies();

            drawCoin();


            // Game Over screen

            if (gameState === "gameover") {

                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";

                ctx.fillRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                ctx.fillStyle = "white";

                ctx.font = "40px Arial";

                ctx.textAlign = "center";

                ctx.fillText(
                    "GAME OVER",
                    canvas.width / 2,
                    canvas.height / 2
                );


                ctx.font = "20px Arial";

                ctx.fillText(
                    "Score: " + score,
                    canvas.width / 2,
                    canvas.height / 2 + 40
                );

            }


            // Win screen

            if (gameState === "win") {

                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";

                ctx.fillRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                ctx.fillStyle = "white";

                ctx.font = "40px Arial";

                ctx.textAlign = "center";

                ctx.fillText(
                    "YOU SURVIVED!",
                    canvas.width / 2,
                    canvas.height / 2
                );


                ctx.font = "20px Arial";

                ctx.fillText(
                    "Score: " + score,
                    canvas.width / 2,
                    canvas.height / 2 + 40
                );

            }

        }


        // ==========================================
        // 11. MOVE PLAYER
        // ==========================================

        function movePlayer() {

            if (keys["arrowup"] || keys["w"]) {

                player.y -= player.speed;

            }

            if (keys["arrowdown"] || keys["s"]) {

                player.y += player.speed;

            }

            if (keys["arrowleft"] || keys["a"]) {

                player.x -= player.speed;

            }

            if (keys["arrowright"] || keys["d"]) {

                player.x += player.speed;

            }


            // Keep player inside canvas

            if (player.x < 0) {

                player.x = 0;

            }

            if (player.x + player.width > canvas.width) {

                player.x = canvas.width - player.width;

            }

            if (player.y < 0) {

                player.y = 0;

            }

            if (player.y + player.height > canvas.height) {

                player.y = canvas.height - player.height;

            }

        }


        // ==========================================
        // 12. MOVE ENEMIES
        // ==========================================

        function moveEnemies() {

            enemies.forEach(function (enemy) {

                enemy.x -= enemy.speed;


                // If enemy leaves the screen,
                // move it back to the right.

                if (enemy.x + enemy.width < 0) {

                    enemy.x = canvas.width + 50;

                    enemy.y =
                        Math.random() *
                        (canvas.height - enemy.height);

                }

            });

        }


        // ==========================================
        // 13. COLLISION DETECTION
        // ==========================================

        function isColliding(objectA, objectB) {

            return (

                objectA.x < objectB.x + objectB.width &&

                objectA.x + objectA.width > objectB.x &&

                objectA.y < objectB.y + objectB.height &&

                objectA.y + objectA.height > objectB.y

            );

        }


        // ==========================================
        // 14. CHECK ENEMY COLLISION
        // ==========================================

        function checkEnemyCollision() {

            enemies.forEach(function (enemy) {

                if (isColliding(player, enemy)) {

                    lives--;

                    livesElement.textContent = lives;


                    // Reset player position

                    player.x = 50;
                    player.y = 180;


                    // Check Game Over

                    if (lives <= 0) {

                        gameOver();

                    }

                }

            });

        }


        // ==========================================
        // 15. CHECK COIN COLLISION
        // ==========================================

        function checkCoinCollision() {

            if (isColliding(player, coin)) {

                score += 10;

                scoreElement.textContent = score;


                // Move coin to random position

                coin.x =
                    Math.random() *
                    (canvas.width - coin.width);

                coin.y =
                    Math.random() *
                    (canvas.height - coin.height);

            }

        }


        // ==========================================
        // 16. UPDATE GAME
        // ==========================================

        function update() {

            if (gameState !== "playing") {

                return;

            }


            movePlayer();

            moveEnemies();

            checkEnemyCollision();

            checkCoinCollision();

        }


        // ==========================================
        // 17. GAME LOOP
        // ==========================================

        function gameLoop() {

            update();

            draw();

            requestAnimationFrame(gameLoop);

        }


        // ==========================================
        // 18. START GAME
        // ==========================================

        function startGame() {

            gameState = "playing";


            score = 0;
            lives = 3;
            timeLeft = 30;


            scoreElement.textContent = score;

            livesElement.textContent = lives;

            timeElement.textContent = timeLeft;


            // Reset player

            player.x = 50;
            player.y = 180;


            // Reset enemies

            enemies[0].x = 550;
            enemies[1].x = 450;
            enemies[2].x = 300;


            // Reset timer

            clearInterval(gameTimer);


            gameTimer = setInterval(function () {

                timeLeft--;

                timeElement.textContent = timeLeft;


                if (timeLeft <= 0) {

                    winGame();

                }

            }, 1000);

        }


        // ==========================================
        // 19. GAME OVER
        // ==========================================

        function gameOver() {

            gameState = "gameover";

            clearInterval(gameTimer);

            startButton.textContent = "Play Again";

        }


        // ==========================================
        // 20. WIN GAME
        // ==========================================

        function winGame() {

            gameState = "win";

            clearInterval(gameTimer);

            startButton.textContent = "Play Again";

        }


        // ==========================================
        // 21. START BUTTON
        // ==========================================

        startButton.addEventListener(
            "click",
            startGame
        );


        // ==========================================
        // 22. START GAME LOOP
        // ==========================================

        gameLoop();

    </script>

</body>

</html>
