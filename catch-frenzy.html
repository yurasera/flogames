<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Catch Frenzy</title>


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================
           BODY
        ========================================= */

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #141e30,
                    #243b55
                );

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            overflow: hidden;
        }


        /* =========================================
           GAME CONTAINER
        ========================================= */

        .game {

            width: 100%;

            max-width: 950px;

            background: #151a24;

            border: 2px solid #303848;

            border-radius: 24px;

            padding: 24px;

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.5);
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 20px;
        }


        .title {

            font-size: 32px;

            font-weight: 800;
        }


        .subtitle {

            color: #8f9bad;

            margin-top: 5px;
        }


        /* =========================================
           STATS
        ========================================= */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 12px;

            margin-bottom: 18px;
        }


        .stat {

            background: #202633;

            border-radius: 15px;

            padding: 14px;

            text-align: center;
        }


        .stat-label {

            color: #8993a4;

            font-size: 12px;

            text-transform: uppercase;

            margin-bottom: 5px;
        }


        .stat-value {

            font-size: 26px;

            font-weight: bold;
        }


        /* =========================================
           GAME AREA
        ========================================= */

        #gameArea {

            position: relative;

            width: 100%;

            height: 550px;

            overflow: hidden;

            border-radius: 20px;

            border: 2px solid #364052;

            background:

                linear-gradient(
                    #4fa4d8 0%,
                    #78c5e8 55%,
                    #9bdc8b 55%,
                    #6eb65e 100%
                );

            cursor: none;
        }


        /* =========================================
           CLOUDS
        ========================================= */

        .cloud {

            position: absolute;

            background: white;

            width: 100px;

            height: 35px;

            border-radius: 30px;

            opacity: 0.7;
        }


        .cloud::before {

            content: "";

            position: absolute;

            width: 45px;

            height: 45px;

            background: white;

            border-radius: 50%;

            left: 15px;

            bottom: 5px;
        }


        .cloud::after {

            content: "";

            position: absolute;

            width: 55px;

            height: 55px;

            background: white;

            border-radius: 50%;

            right: 10px;

            bottom: 0;
        }


        .cloud-1 {

            top: 50px;

            left: 10%;

        }


        .cloud-2 {

            top: 120px;

            right: 10%;

            transform: scale(0.7);
        }


        .cloud-3 {

            top: 200px;

            left: 45%;

            transform: scale(0.5);
        }


        /* =========================================
           BASKET
        ========================================= */

        #basket {

            position: absolute;

            width: 110px;

            height: 65px;

            bottom: 25px;

            left: 50%;

            transform:
                translateX(-50%);

            background:
                linear-gradient(
                    #b86b32,
                    #783b1d
                );

            border-radius:
                8px 8px 35px 35px;

            border:
                4px solid #542714;

            z-index: 10;
        }


        #basket::before {

            content: "";

            position: absolute;

            width: 70px;

            height: 40px;

            border:
                7px solid #542714;

            border-bottom: none;

            border-radius:
                50px 50px 0 0;

            top: -30px;

            left: 50%;

            transform:
                translateX(-50%);
        }


        #basket::after {

            content: "";

            position: absolute;

            width: 85px;

            height: 10px;

            background:
                rgba(255,255,255,0.15);

            border-radius: 50%;

            top: 10px;

            left: 10px;
        }


        /* =========================================
           FALLING OBJECT
        ========================================= */

        .item {

            position: absolute;

            width: 50px;

            height: 50px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 36px;

            user-select: none;

            z-index: 5;

            filter:
                drop-shadow(
                    0 5px 4px
                    rgba(0,0,0,0.25)
                );
        }


        /* =========================================
           GOLDEN ITEM
        ========================================= */

        .golden {

            filter:
                drop-shadow(
                    0 0 12px
                    #ffe066
                );

            animation:
                goldenGlow
                0.5s
                infinite
                alternate;
        }


        @keyframes goldenGlow {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.2);
            }

        }


        /* =========================================
           MESSAGE
        ========================================= */

        #message {

            position: absolute;

            top: 50%;

            left: 50%;

            transform:
                translate(-50%, -50%);

            text-align: center;

            z-index: 20;

            width: 90%;
        }


        #message h2 {

            font-size: 46px;

            margin-bottom: 10px;

            text-shadow:
                0 4px 10px
                rgba(0,0,0,0.3);
        }


        #message p {

            font-size: 18px;

            color: #eef7ff;

            line-height: 1.6;
        }


        /* =========================================
           START BUTTON
        ========================================= */

        #startButton {

            margin-top: 18px;

            border: none;

            padding:
                15px 35px;

            border-radius: 14px;

            background:
                #ff6b35;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(0,0,0,0.25);

            transition:
                transform 0.2s,
                background 0.2s;
        }


        #startButton:hover {

            background: #ff814f;

            transform:
                translateY(-3px);
        }


        #startButton:active {

            transform:
                scale(0.95);
        }


        /* =========================================
           SCORE POPUP
        ========================================= */

        .score-popup {

            position: absolute;

            pointer-events: none;

            font-size: 24px;

            font-weight: bold;

            z-index: 30;

            animation:
                scoreAnimation
                0.8s
                forwards;
        }


        @keyframes scoreAnimation {

            0% {

                opacity: 1;

                transform:
                    translate(-50%, 0)
                    scale(1);
            }

            100% {

                opacity: 0;

                transform:
                    translate(-50%, -70px)
                    scale(1.3);
            }
        }


        /* =========================================
           PARTICLE
        ========================================= */

        .particle {

            position: absolute;

            width: 8px;

            height: 8px;

            border-radius: 50%;

            pointer-events: none;

            z-index: 25;

            animation:
                particleAnimation
                0.7s
                forwards;
        }


        @keyframes particleAnimation {

            0% {

                opacity: 1;

                transform:
                    translate(0, 0)
                    scale(1);
            }

            100% {

                opacity: 0;

                transform:
                    translate(
                        var(--move-x),
                        var(--move-y)
                    )
                    scale(0);
            }
        }


        /* =========================================
           LEVEL UP
        ========================================= */

        .level-up {

            position: absolute;

            top: 40%;

            left: 50%;

            transform:
                translate(-50%, -50%);

            font-size: 42px;

            font-weight: bold;

            z-index: 50;

            pointer-events: none;

            animation:
                levelAnimation
                1.2s
                forwards;
        }


        @keyframes levelAnimation {

            0% {

                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(0.5);
            }

            30% {

                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1.2);
            }

            100% {

                opacity: 0;

                transform:
                    translate(-50%, -100%)
                    scale(1);
            }
        }


        /* =========================================
           CONTROLS
        ========================================= */

        .controls {

            text-align: center;

            margin-top: 16px;

            color: #9da7b7;

            font-size: 14px;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 700px) {

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);
            }


            #gameArea {

                height: 450px;
            }


            .title {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<div class="game">


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="header">

        <div>

            <div class="title">
                🍎 Catch Frenzy
            </div>

            <div class="subtitle">
                Catch the good stuff. Avoid the bombs!
            </div>

        </div>

    </div>


    <!-- =====================================
         STATS
    ====================================== -->

    <div class="stats">

        <div class="stat">

            <div class="stat-label">
                Score
            </div>

            <div
                id="score"
                class="stat-value">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Time
            </div>

            <div
                id="time"
                class="stat-value">
                60
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Level
            </div>

            <div
                id="level"
                class="stat-value">
                1
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Lives
            </div>

            <div
                id="lives"
                class="stat-value">
                ❤️❤️❤️
            </div>

        </div>

    </div>


    <!-- =====================================
         GAME AREA
    ====================================== -->

    <div id="gameArea">


        <!-- CLOUDS -->

        <div class="cloud cloud-1"></div>

        <div class="cloud cloud-2"></div>

        <div class="cloud cloud-3"></div>


        <!-- MESSAGE -->

        <div id="message">

            <h2>
                🍎 Catch Frenzy
            </h2>

            <p>

                Catch the fruits!

                <br>

                Avoid the bombs!

                <br>

                Use ← → or A / D

            </p>

            <button id="startButton">
                START GAME
            </button>

        </div>


        <!-- BASKET -->

        <div id="basket"></div>


    </div>


    <!-- =====================================
         CONTROLS
    ====================================== -->

    <div class="controls">

        ← → Move Basket
        &nbsp;&nbsp;|&nbsp;&nbsp;
        A / D Move Basket

    </div>


</div>



<script>

    /* =====================================================
       GET HTML ELEMENTS
    ===================================================== */

    const gameArea =
        document.getElementById(
            "gameArea"
        );


    const basket =
        document.getElementById(
            "basket"
        );


    const startButton =
        document.getElementById(
            "startButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    const scoreElement =
        document.getElementById(
            "score"
        );


    const timeElement =
        document.getElementById(
            "time"
        );


    const levelElement =
        document.getElementById(
            "level"
        );


    const livesElement =
        document.getElementById(
            "lives"
        );


    /* =====================================================
       GAME VARIABLES
    ===================================================== */

    let score = 0;

    let timeLeft = 60;

    let level = 1;

    let lives = 3;

    let gameRunning = false;

    let basketX = 0;

    let timer;

    let spawnTimer;

    let gameLoop;


    /*
        Menyimpan semua object
        yang sedang jatuh.
    */

    let items = [];


    /* =====================================================
       ITEM TYPES
    ===================================================== */

    const fruits = [

        "🍎",
        "🍊",
        "🍌",
        "🍉",
        "🍇",
        "🍓",
        "🍍",
        "🥝"

    ];


    /* =====================================================
       HIGH SCORE
    ===================================================== */

    let highScore =
        Number(
            localStorage.getItem(
                "catchHighScore"
            )
        ) || 0;


    /* =====================================================
       KEYBOARD
    ===================================================== */

    const keys = {};


    document.addEventListener(
        "keydown",
        function(event) {

            keys[event.key.toLowerCase()] =
                true;

        }
    );


    document.addEventListener(
        "keyup",
        function(event) {

            keys[event.key.toLowerCase()] =
                false;

        }
    );


    /* =====================================================
       START GAME
    ===================================================== */

    startButton.addEventListener(
        "click",
        startGame
    );


    function startGame() {

        /*
            Reset semua nilai.
        */

        score = 0;

        timeLeft = 60;

        level = 1;

        lives = 3;

        basketX =
            gameArea.clientWidth / 2;


        gameRunning = true;


        /*
            Update UI.
        */

        scoreElement.textContent =
            score;

        timeElement.textContent =
            timeLeft;

        levelElement.textContent =
            level;

        updateLives();


        /*
            Bersihkan object
            dari game sebelumnya.
        */

        items.forEach(
            function(item) {

                item.element.remove();

            }
        );


        items = [];


        /*
            Sembunyikan message.
        */

        message.style.display =
            "none";


        /*
            Posisikan basket.
        */

        basket.style.left =
            basketX + "px";


        /*
            Mulai timer.
        */

        timer =
            setInterval(
                updateTimer,
                1000
            );


        /*
            Mulai membuat object.
        */

        spawnTimer =
            setInterval(
                spawnItem,
                700
            );


        /*
            Jalankan game loop.
        */

        gameLoop =
            requestAnimationFrame(
                updateGame
            );

    }


    /* =====================================================
       TIMER
    ===================================================== */

    function updateTimer() {

        if (!gameRunning) {

            return;

        }


        timeLeft--;


        timeElement.textContent =
            timeLeft;


        /*
            Setiap 15 detik,
            level meningkat.
        */

        const newLevel =
            Math.floor(
                (60 - timeLeft) / 15
            ) + 1;


        if (
            newLevel > level
        ) {

            level =
                newLevel;

            levelElement.textContent =
                level;

            showLevelUp();

        }


        if (
            timeLeft <= 0
        ) {

            endGame();

        }

    }


    /* =====================================================
       SPAWN ITEM
    ===================================================== */

    function spawnItem() {

        if (!gameRunning) {

            return;

        }


        /*
            Membuat element baru.
        */

        const element =
            document.createElement(
                "div"
            );


        element.className =
            "item";


        /*
            Random item.
        */

        const random =
            Math.random();


        let type;


        if (
            random < 0.15
        ) {

            /*
                15% kemungkinan
                mendapatkan bomb.
            */

            type = "bomb";

            element.textContent =
                "💣";

        }

        else if (
            random < 0.22
        ) {

            /*
                7% kemungkinan
                mendapatkan golden fruit.
            */

            type = "golden";

            element.textContent =
                "⭐";

            element.classList.add(
                "golden"
            );

        }

        else {

            /*
                Sisanya buah biasa.
            */

            type = "fruit";

            const randomFruit =
                fruits[
                    Math.floor(
                        Math.random() *
                        fruits.length
                    )
                ];

            element.textContent =
                randomFruit;

        }


        /*
            Random posisi X.
        */

        const maxX =
            gameArea.clientWidth - 50;


        const x =
            Math.random() *
            maxX;


        /*
            Posisi awal
            di atas layar.
        */

        const y = -60;


        element.style.left =
            x + "px";


        element.style.top =
            y + "px";


        gameArea.appendChild(
            element
        );


        /*
            Kecepatan jatuh.

            Level semakin tinggi,
            object semakin cepat.
        */

        const speed =
            2 +
            Math.random() * 2 +
            level * 0.5;


        /*
            Simpan object
            ke dalam array.
        */

        items.push({

            element: element,

            x: x,

            y: y,

            speed: speed,

            type: type

        });

    }


    /* =====================================================
       GAME LOOP
    ===================================================== */

    function updateGame() {

        if (!gameRunning) {

            return;

        }


        moveBasket();


        /*
            Loop semua item.
        */

        for (
            let i = items.length - 1;
            i >= 0;
            i--
        ) {

            const item =
                items[i];


            /*
                Gerakkan object
                ke bawah.
            */

            item.y +=
                item.speed;


            item.element.style.top =
                item.y + "px";


            /*
                Periksa collision.
            */

            if (
                checkCollision(item)
            ) {

                catchItem(i);

                continue;

            }


            /*
                Jika object keluar
                dari layar.
            */

            if (
                item.y >
                gameArea.clientHeight
            ) {

                /*
                    Jika buah terlewat,
                    tidak langsung kehilangan nyawa.
                */

                removeItem(i);

            }

        }


        /*
            Jalankan loop lagi.
        */

        gameLoop =
            requestAnimationFrame(
                updateGame
            );

    }


    /* =====================================================
       MOVE BASKET
    ===================================================== */

    function moveBasket() {

        const basketSpeed = 8;


        /*
            Keyboard Arrow Left
            atau tombol A.
        */

        if (
            keys["arrowleft"] ||
            keys["a"]
        ) {

            basketX -=
                basketSpeed;

        }


        /*
            Keyboard Arrow Right
            atau tombol D.
        */

        if (
            keys["arrowright"] ||
            keys["d"]
        ) {

            basketX +=
                basketSpeed;

        }


        /*
            Jangan sampai
            basket keluar arena.
        */

        const maxX =
            gameArea.clientWidth -
            basket.offsetWidth;


        if (
            basketX < 0
        ) {

            basketX = 0;

        }


        if (
            basketX > maxX
        ) {

            basketX = maxX;

        }


        basket.style.left =
            basketX + "px";

    }


    /* =====================================================
       COLLISION DETECTION
    ===================================================== */

    function checkCollision(
        item
    ) {

        const basketLeft =
            basketX;


        const basketRight =
            basketX +
            basket.offsetWidth;


        const basketTop =
            gameArea.clientHeight -
            basket.offsetHeight -
            25;


        const itemLeft =
            item.x;


        const itemRight =
            item.x + 50;


        const itemBottom =
            item.y + 50;


        /*
            Apakah object menyentuh basket?
        */

        return (

            itemRight >
            basketLeft &&

            itemLeft <
            basketRight &&

            itemBottom >
            basketTop &&

            item.y <
            basketTop +
            basket.offsetHeight

        );

    }


    /* =====================================================
       CATCH ITEM
    ===================================================== */

    function catchItem(
        index
    ) {

        const item =
            items[index];


        /*
            Hitung posisi
            untuk efek.
        */

        const rect =
            item.element.getBoundingClientRect();


        const areaRect =
            gameArea.getBoundingClientRect();


        const x =
            rect.left -
            areaRect.left +
            25;


        const y =
            rect.top -
            areaRect.top +
            25;


        /* =====================================
           FRUIT
        ===================================== */

        if (
            item.type === "fruit"
        ) {

            score += 10;


            showScore(
                x,
                y,
                "+10"
            );


            createParticles(
                x,
                y
            );

        }


        /* =====================================
           GOLDEN
        ===================================== */

        else if (
            item.type === "golden"
        ) {

            score += 50;


            showScore(
                x,
                y,
                "⭐ +50!"
            );


            createParticles(
                x,
                y
            );

        }


        /* =====================================
           BOMB
        ===================================== */

        else if (
            item.type === "bomb"
        ) {

            lives--;


            updateLives();


            showScore(
                x,
                y,
                "💥 BOOM!"
            );


            createParticles(
                x,
                y
            );


            /*
                Kalau nyawa habis,
                game selesai.
            */

            if (
                lives <= 0
            ) {

                endGame();

            }

        }


        /*
            Update score.
        */

        scoreElement.textContent =
            score;


        /*
            Hapus object.
        */

        removeItem(index);

    }


    /* =====================================================
       REMOVE ITEM
    ===================================================== */

    function removeItem(
        index
    ) {

        const item =
            items[index];


        if (
            item &&
            item.element
        ) {

            item.element.remove();

        }


        items.splice(
            index,
            1
        );

    }


    /* =====================================================
       UPDATE LIVES
    ===================================================== */

    function updateLives() {

        let hearts = "";


        for (
            let i = 0;
            i < lives;
            i++
        ) {

            hearts += "❤️";

        }


        for (
            let i = lives;
            i < 3;
            i++
        ) {

            hearts += "🖤";

        }


        livesElement.textContent =
            hearts;

    }


    /* =====================================================
       SCORE POPUP
    ===================================================== */

    function showScore(
        x,
        y,
        text
    ) {

        const popup =
            document.createElement(
                "div"
            );


        popup.className =
            "score-popup";


        popup.textContent =
            text;


        popup.style.left =
            x + "px";


        popup.style.top =
            y + "px";


        gameArea.appendChild(
            popup
        );


        setTimeout(
            function() {

                popup.remove();

            },
            800
        );

    }


    /* =====================================================
       PARTICLES
    ===================================================== */

    function createParticles(
        x,
        y
    ) {

        for (
            let i = 0;
            i < 15;
            i++
        ) {

            const particle =
                document.createElement(
                    "div"
                );


            particle.className =
                "particle";


            particle.style.left =
                x + "px";


            particle.style.top =
                y + "px";


            /*
                Random direction.
            */

            const angle =
                Math.random() *
                Math.PI *
                2;


            const distance =
                30 +
                Math.random() *
                80;


            const moveX =
                Math.cos(angle) *
                distance;


            const moveY =
                Math.sin(angle) *
                distance;


            particle.style.setProperty(
                "--move-x",
                moveX + "px"
            );


            particle.style.setProperty(
                "--move-y",
                moveY + "px"
            );


            gameArea.appendChild(
                particle
            );


            setTimeout(
                function() {

                    particle.remove();

                },
                700
            );

        }

    }


    /* =====================================================
       LEVEL UP
    ===================================================== */

    function showLevelUp() {

        const text =
            document.createElement(
                "div"
            );


        text.className =
            "level-up";


        text.textContent =
            `LEVEL ${level}!`;


        gameArea.appendChild(
            text
        );


        setTimeout(
            function() {

                text.remove();

            },
            1200
        );

    }


    /* =====================================================
       END GAME
    ===================================================== */

    function endGame() {

        if (!gameRunning) {

            return;

        }


        gameRunning = false;


        /*
            Stop timer.
        */

        clearInterval(
            timer
        );


        /*
            Stop spawning.
        */

        clearInterval(
            spawnTimer
        );


        /*
            Stop animation loop.
        */

        cancelAnimationFrame(
            gameLoop
        );


        /*
            Hapus semua object.
        */

        items.forEach(
            function(item) {

                item.element.remove();

            }
        );


        items = [];


        /*
            Simpan high score.
        */

        if (
            score > highScore
        ) {

            highScore =
                score;


            localStorage.setItem(
                "catchHighScore",
                highScore
            );

        }


        /*
            Tampilkan hasil.
        */

        message.style.display =
            "block";


        message.innerHTML = `

            <h2>
                ${
                    score >= 300
                    ? "🏆 AMAZING!"
                    : "🎮 GAME OVER!"
                }
            </h2>

            <p>

                Score:
                <strong>
                    ${score}
                </strong>

                <br>

                Level:
                <strong>
                    ${level}
                </strong>

                <br>

                Best Score:
                <strong>
                    ${highScore}
                </strong>

            </p>

            <button id="restartButton">

                PLAY AGAIN

            </button>

        `;


        /*
            Tombol restart.
        */

        document
            .getElementById(
                "restartButton"
            )
            .addEventListener(
                "click",
                startGame
            );

    }

</script>
